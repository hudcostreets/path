name: Deploy www
# Site-code deploys (data-update deploys run as `www/deploy.dvc` in `daily.yml`).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'www/public/**/*.dvc'
      - '.dvc/config'
jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto  # R2 (S3-compatible) uses region `auto`
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_HCCS_INFRA_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2363642879f18d37d52dca114059937e  # HCCS
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -e .
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: www/pnpm-lock.yaml
      - name: Install Playwright browsers (deploy's e2e tests)
        working-directory: www
        run: pnpm install && npx playwright install --with-deps chromium
      # `dvx pull`/`push` of `www/public` artifacts, build, e2e, `wrangler pages deploy`
      - name: Deploy
        run: path-data deploy
